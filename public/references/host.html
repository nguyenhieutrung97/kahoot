<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kahoot Advanced Game - Host (No Auth)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
            min-height: 100vh;
            color: #333;
            margin: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .screen {
            background: #fff;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
            display: none;
        }

        .screen.active {
            display: block;
        }

        h1, h2, h3 {
            color: #46178f;
            margin: 0 0 20px;
            text-align: center;
        }

        .btn {
            background: #46178f;
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: .3s background;
        }

        .btn:hover:not(:disabled) {
            background: #5a1fa0;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-group {
            text-align: center;
            margin: 20px 0;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            z-index: 1000;
        }

        .connected {
            background: #d4edda;
            color: #155724;
        }

        .disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .game-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #dee2e6;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #46178f;
        }

        .leaderboard {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg,#f8f9fa 0%,#e9ecef 100%);
            border-radius: 15px;
            border: 2px solid #dee2e6;
            box-shadow: 0 4px 15px rgba(0,0,0,.1);
        }

        .leaderboard h4 {
            color: #46178f;
            font-size: 18px;
            font-weight: bold;
            margin: 0 0 15px;
            text-align: center;
            border-bottom: 2px solid #46178f;
            padding-bottom: 8px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            transition: .3s;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }

        .leaderboard-item .rank {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            min-width: 80px;
        }

        .leaderboard-item .player-info {
            flex: 1;
            margin-left: 10px;
        }

        .leaderboard-item .score {
            font-size: 16px;
            font-weight: bold;
            color: #46178f;
            background: #f0e6ff;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .host-question-display {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            border: 3px solid #46178f;
        }

        .host-timer {
            font-size: 36px;
            color: #e74c3c;
            text-align: center;
            margin: 15px 0;
            font-weight: bold;
        }

        .host-question-text {
            font-size: 20px;
            margin: 20px 0;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            border-left: 5px solid #46178f;
            text-align: center;
        }

        .host-answers-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .host-answer-card {
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #dee2e6;
            background: #fff;
            position: relative;
        }

        .host-answer-card.correct {
            border-color: #28a745;
            background: linear-gradient(135deg,#d4edda,#fff);
        }

        .host-answer-card.incorrect {
            border-color: #dc3545;
            background: linear-gradient(135deg,#f8d7da,#fff);
        }

        .correct-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .incorrect-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #dc3545;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .player-count-indicator {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: #17a2b8;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
        }

        /* Early Results Button Styling */
        .show-early-results {
            background: #28a745 !important;
            animation: pulse-green 2s infinite;
            box-shadow: 0 0 15px rgba(40, 167, 69, 0.5);
        }

        .show-early-results:hover {
            background: #218838 !important;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.7);
        }

        @keyframes pulse-green {
            0% {
                box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(40, 167, 69, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(40, 167, 69, 0);
            }
        }

        .all-answered-notification {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            border: 2px solid #1e7e34;
            animation: slide-in 0.5s ease-out;
        }

        @keyframes slide-in {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<div id="connectionStatus" class="connection-status disconnected">Disconnected</div>
<div class="container">
    <div id="setupScreen" class="screen active">
        <h1>Kahoot Advanced Game - Host (No Auth)</h1>
        <div class="input-group">
            <label for="gameIdInput">Game ID:</label>
            <input type="text" id="gameIdInput" placeholder="Enter Game ID" />
        </div>
        <div class="btn-group">
            <button class="btn" id="createRoomBtn">Create Game Room</button>
            <button class="btn" id="openPlayerPageBtn" style="background:#28a745">Open Player Page</button>
        </div>
    </div>

    <div id="lobbyScreen" class="screen">
        <h2>Game Lobby</h2>
        <div id="roomCodeDisplay"></div>
        <div id="gameStats" class="game-stats"></div>
        <div id="playersInLobby"></div>
        <div class="btn-group">
            <button class="btn" id="startGameBtn" disabled>Start Game</button>
            <button class="btn" id="backToSetupBtn" style="background:#6c757d">Back to Setup</button>
        </div>
    </div>

    <div id="gameScreen" class="screen">
        <h2>Game Management</h2>
        <div id="gameInfo"></div>
        <div id="hostQuestionDisplay" class="host-question-display" style="display:none;">
            <div id="hostTimer" class="host-timer"></div>
            <div id="hostQuestionText" class="host-question-text"></div>
            <div id="hostAnswersDisplay" class="host-answers-display"></div>
        </div>
        <div id="questionProgress"></div>
        <div id="hostLeaderboard" class="leaderboard"></div>
        <div class="btn-group">
            <button class="btn" id="nextQuestionBtn" disabled>▶ Next Question</button>
            <button class="btn" id="endGameBtn" style="background:#dc3545">⛔ End Game</button>
        </div>
    </div>

    <div id="resultsScreen" class="screen">
        <h2>Game Completed!</h2>
        <div id="finalResults" class="leaderboard"></div>
        <div class="btn-group">
            <button class="btn" id="newGameBtn">Start New Game</button>
        </div>
    </div>

    <div id="statusMessages"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
<script>
// --- Global (auth removed) ---
let connection;
let currentRoomCode = '';
let totalPlayersInGame = 0;
let currentAutoShowResults = true;
const statusMethodCandidates = ['GetRoomStatus','GetLobbyInfo','GetRoom','GetLobby'];

// DOM refs
const setupScreen = document.getElementById('setupScreen');
const lobbyScreen = document.getElementById('lobbyScreen');
const gameScreen = document.getElementById('gameScreen');
const resultsScreen = document.getElementById('resultsScreen');
const connectionStatus = document.getElementById('connectionStatus');
const statusMessages = document.getElementById('statusMessages');
const gameIdInput = document.getElementById('gameIdInput');
const createRoomBtn = document.getElementById('createRoomBtn');
const openPlayerPageBtn = document.getElementById('openPlayerPageBtn');
const roomCodeDisplay = document.getElementById('roomCodeDisplay');
const gameStats = document.getElementById('gameStats');
const playersInLobby = document.getElementById('playersInLobby');
const startGameBtn = document.getElementById('startGameBtn');
const backToSetupBtn = document.getElementById('backToSetupBtn');
const gameInfo = document.getElementById('gameInfo');
const hostQuestionDisplay = document.getElementById('hostQuestionDisplay');
const hostTimer = document.getElementById('hostTimer');
const hostQuestionText = document.getElementById('hostQuestionText');
const hostAnswersDisplay = document.getElementById('hostAnswersDisplay');
const questionProgress = document.getElementById('questionProgress');
const hostLeaderboard = document.getElementById('hostLeaderboard');
const nextQuestionBtn = document.getElementById('nextQuestionBtn');
const endGameBtn = document.getElementById('endGameBtn');
const finalResults = document.getElementById('finalResults');
const newGameBtn = document.getElementById('newGameBtn');

function showStatus(message, type='info') {
  const div = document.createElement('div');
  div.className = `status ${type}`;
  div.textContent = message;
  statusMessages.appendChild(div);
  setTimeout(()=>{div.remove();},3000);
}

function updateConnectionStatus(connected){
  connectionStatus.textContent = connected ? 'Connected' : 'Disconnected';
  connectionStatus.className = `connection-status ${connected?'connected':'disconnected'}`;
}

async function initConnection(){
  try {
    if (connection && connection.state === signalR.HubConnectionState.Connected) return connection;
    if (connection) { try { await connection.stop(); } catch(_){} }
    connection = new signalR.HubConnectionBuilder()
      .withUrl('https://localhost:7007/gameHub', { skipNegotiation: true, transport: signalR.HttpTransportType.WebSockets })
      .configureLogging(signalR.LogLevel.Information)
      .withAutomaticReconnect([0,2000,5000,10000])
      .build();
    setupSignalRHandlers();
    await connection.start();
    updateConnectionStatus(true);
    showStatus('Connected to hub','success');
    if (currentRoomCode) requestRoomStatus();
    return connection;
  } catch (e){
    updateConnectionStatus(false);
    showStatus('Connection failed: '+ e.message,'error');
    throw e;
  }
}

function logDebug(msg, extra){ try { console.debug('[HOST]', msg, extra||''); } catch{} }
async function requestRoomStatus() {
  if (!connection || connection.state !== signalR.HubConnectionState.Connected) return;
  for (const m of statusMethodCandidates) {
    try {
      const res = currentRoomCode ? await connection.invoke(m, currentRoomCode) : await connection.invoke(m);
      if (res && typeof res === 'object') {
        // Normalize shape (expect players, playerCount, canStart, autoShowResults)
        const lobbyLike = {
          players: res.players || res.playerList || res.Players || [],
          playerCount: res.playerCount || res.totalPlayers || (res.players?.length) || 0,
          canStart: !!(res.canStart ?? (res.players?.length > 0)),
          autoShowResults: typeof res.autoShowResults === 'boolean' ? res.autoShowResults : currentAutoShowResults
        };
        currentAutoShowResults = lobbyLike.autoShowResults;
        updateLobbyDisplay(lobbyLike);
        logDebug('Status fetched via ' + m, lobbyLike);
        return;
      }
    } catch (err) {
      const msg = String(err?.message||'').toLowerCase();
      if (msg.includes('does not exist') || msg.includes('no method') || msg.includes('could not find')) continue;
      logDebug('Status method failed '+m, err);
      continue;
    }
  }
  logDebug('No status method succeeded');
}

function setupSignalRHandlers(){
  // Reconnect lifecycle
  connection.onreconnecting(() => { updateConnectionStatus(false); showStatus('Reconnecting...','info'); });
  connection.onreconnected(() => { updateConnectionStatus(true); showStatus('Reconnected','success'); if (currentRoomCode) requestRoomStatus(); });
  connection.onclose(() => { updateConnectionStatus(false); showStatus('Disconnected','error'); });
  // Message handlers
  connection.on('RoomCreated', data => {
    currentRoomCode = data.roomCode;
    currentAutoShowResults = data.autoShowResults;
    showStatus(`Room created: ${data.roomCode}`,'success');
    roomCodeDisplay.innerHTML = `<div class="status success"><h3>Room Code: ${data.roomCode}</h3><p>Share with players.</p><p><strong>Result Mode:</strong> ${data.autoShowResults ? 'Auto' : 'Manual'}</p></div>`;
    gameStats.innerHTML = `
      <div class="stat-card"><div class="stat-number">${data.totalQuestions}</div><div>Questions</div></div>
      <div class="stat-card"><div class="stat-number">${Math.floor(data.totalPlaytime/60)}m ${data.totalPlaytime%60}s</div><div>Total Time</div></div>
      <div class="stat-card"><div class="stat-number">0</div><div>Players</div></div>
      <div class="stat-card"><div class="stat-number">${data.autoShowResults?'Auto':'Manual'}</div><div>Result Mode</div></div>`;
    showScreen('lobbyScreen');
    requestRoomStatus(); // fetch freshest lobby details
  });

  connection.on('LobbyInfo', data => updateLobbyDisplay(data));
  connection.on('PlayerJoined', d => {
    try {
      if (d && Array.isArray(d.players)) {
        updateLobbyDisplay({
          players: d.players,
          playerCount: d.totalPlayers || d.players.length,
            canStart: d.canStart ?? (d.players.length > 0)
        });
      }
    } catch(e){ console.warn('PlayerJoined update failed', e); }
    showStatus(`${d.userName || d.name} joined (${d.totalPlayers || (d.players?.length||0)})`,'info');
  });
  connection.on('PlayerLeft', d => showStatus(`${d.userName} left`,'info'));
  connection.on('GameStarted', data => {
    showStatus('Game started','success');
    showScreen('gameScreen');
    gameInfo.innerHTML = `<div class="game-stats">
      <div class="stat-card"><div class="stat-number">${data.totalQuestions}</div><div>Total Questions</div></div>
      <div class="stat-card"><div class="stat-number">${Math.floor(data.totalPlaytime/60)}m ${data.totalPlaytime%60}s</div><div>Total Game Time</div></div>
    </div>`;
  });
  connection.on('HostNewQuestion', data => displayHostQuestion(data));
  connection.on('QuestionResults', data => {
    if (data.showFinalLeaderboardReady) displayHostLastQuestionResults(data); else displayHostQuestionResults(data);
  });
  connection.on('GameCompleted', data => { displayHostGameResults(data); showStatus('Game completed','success'); });
  connection.on('GameEnded', data => { displayHostGameResults(data); showStatus('Game ended','info'); });
  connection.on('FinalResults', data => { displayHostFinalResults(data); showScreen('resultsScreen'); });
  connection.on('Error', m => showStatus(m,'error'));
}

function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

function updateLobbyDisplay(data){
  let html = `<div class="player-list"><h3>Players (${data.playerCount})</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;">`;
  if (data.players?.length){
    data.players.forEach(p=>{ html += `<div class="player-item"><span>${p.name}</span><span style="font-size:12px;color:#666;">Joined: ${new Date(p.joinedAt).toLocaleTimeString()}</span></div>`; });
  } else html += '<p>No players yet</p>';
  html += '</div>';
  const playerCountCard = gameStats.querySelector('.stat-card:nth-child(3)');
  if (playerCountCard) playerCountCard.querySelector('.stat-number').textContent = data.playerCount;
  playersInLobby.innerHTML = html;
  startGameBtn.disabled = !data.canStart;
}

function displayHostQuestion(data){
  hostQuestionDisplay.style.display='block';
  questionProgress.innerHTML=''; hostLeaderboard.innerHTML=''; nextQuestionBtn.disabled=true;
  const typeIcon = {SingleChoice:'📍', MultipleChoice:'☑️', TrueFalse:'✓❌'}[data.questionType] || '❓';
  const badge = data.isMultipleChoice ? '☑️ MULTIPLE CHOICE' : (data.questionType==='TrueFalse' ? '✓❌ TRUE/FALSE' : '📍 SINGLE CHOICE');
  hostQuestionText.innerHTML = `<h3>Question ${data.questionIndex} of ${data.totalQuestions} ${typeIcon}</h3><div style="margin-bottom:10px;font-weight:bold;">${badge}</div><p>${data.questionText}</p>`;
  const correctAnswers = data.correctAnswers || (data.correctAnswer ? [data.correctAnswer] : []);
  const correctIds = correctAnswers.map(c=>c.id||c.Id);
  hostAnswersDisplay.innerHTML = data.answers.map((a,i)=>{
    const isCorrect = a.isCorrect || correctIds.includes(a.id);
    return `<div class="host-answer-card ${isCorrect?'correct':'incorrect'}"><div class="host-answer-label">${String.fromCharCode(65+i)})</div><div class="host-answer-text">${a.title}</div>${isCorrect?`<div id="answer-${a.id}" class="correct-indicator">✅</div>`:`<div id="answer-${a.id}" class="incorrect-indicator">❌</div>`}</div>`;
  }).join('');
  startHostTimer(data.timeLimitSeconds);
}

function displayHostQuestionResults(data){
  questionProgress.innerHTML = `<div class="host-controls"><h4>📊 Question Results</h4><p><strong>Players Answered:</strong> ${data.playersAnswered}/${data.totalPlayers}</p></div>`;
  hostLeaderboard.innerHTML = '<h4>🏆 Current Leaderboard</h4>' + data.leaderboard.map((p,i)=>{
    const medal = ['🥇','🥈','🥉'][i] || '🏅';
    const rank = i+1; const rankClass = rank<=3?`rank-${rank}`:'';
    return `<div class="leaderboard-item ${rankClass}"><div class="rank"><span class="medal">${medal}</span>#${p.rank}</div><div class="player-info"><strong>${p.userName}</strong><span class="progress-indicator">(${p.progress})</span></div><div class="score">${p.score} pts</div></div>`;
  }).join('');
  if (data.isLastQuestion){
    nextQuestionBtn.style.display='none';
    let btn = document.getElementById('finalLeaderboardBtn');
    if (!btn){ btn = document.createElement('button'); btn.id='finalLeaderboardBtn'; btn.className='btn'; btn.style.cssText='background:#28a745'; btn.textContent='🏆 Show Final Leaderboard'; btn.onclick=showFinalLeaderboard; nextQuestionBtn.parentNode.insertBefore(btn,nextQuestionBtn);} 
    btn.style.display='inline-block'; btn.disabled=false;
    showStatus('Last question complete. Show final leaderboard.','success');
  } else { nextQuestionBtn.disabled=false; nextQuestionBtn.textContent='▶ Next Question'; }
}
function displayHostLastQuestionResults(d){ displayHostQuestionResults({...d,isLastQuestion:true}); }
async function showFinalLeaderboard(){ if(!currentRoomCode) return; try { await connection.invoke('ShowFinalLeaderboard', currentRoomCode); showStatus('Showing final leaderboard','info'); } catch(e){ showStatus('Failed: '+e.message,'error'); } }

function displayHostGameResults(data){ displayHostFinalResults(data); }
function displayHostFinalResults(data){
  let html = `<div class="status success" style="margin-bottom:30px;"><h3>🎉 Game Completed</h3></div>`;
  if (data.topThreePlayers){ html += `<div class="top-three-section"><h3>🏆 TOP 3</h3><div class="top-three-podium">` + data.topThreePlayers.map((p,i)=>{ const medals=['🥇','🥈','🥉']; return `<div class="champion-card" style="border:3px solid #FFD70020;background:linear-gradient(135deg,#FFD70022,#fff);"><div class="champion-medal">${medals[i]}</div><div class="champion-name">${p.userName}</div><div class="champion-score">${p.score} pts</div></div>`; }).join('') + `</div></div>`; }
  const leaderboard = data.finalLeaderboard || data.leaderboard || [];
  html += '<h3>📊 Final Leaderboard</h3>' + leaderboard.map((p,i)=>{ const medal=['🥇','🥈','🥉'][i]||'🏅'; return `<div class="leaderboard-item"><div class="rank">${medal} #${p.rank||i+1}</div><div class="player-info"><strong>${p.userName}</strong></div><div class="score">${p.score} pts</div></div>`; }).join('');
  finalResults.innerHTML = html; showScreen('resultsScreen');
}

// Timers
let hostTimerInterval=null; function startHostTimer(seconds){ clearHostTimer(); let t=seconds; const tick=()=>{ if(hostTimer) hostTimer.textContent = `⏱️ ${Math.ceil(t)}s`; if(t<=0){ clearHostTimer(); if(hostTimer) hostTimer.textContent="⏰ Time's up!"; } else t-=0.1; }; tick(); hostTimerInterval=setInterval(tick,100);} function clearHostTimer(){ if(hostTimerInterval){ clearInterval(hostTimerInterval); hostTimerInterval=null; } }

function resetToSetup(){ showScreen('setupScreen'); currentRoomCode=''; roomCodeDisplay.innerHTML=''; playersInLobby.innerHTML=''; gameStats.innerHTML=''; hostQuestionDisplay.style.display='none'; questionProgress.innerHTML=''; hostLeaderboard.innerHTML=''; startGameBtn.disabled=true; nextQuestionBtn.disabled=true; nextQuestionBtn.style.display='inline-block'; clearHostTimer(); }

// Event handlers
createRoomBtn.addEventListener('click', async ()=>{
  const gameId = gameIdInput.value.trim();
  if(!gameId){ showStatus('Enter a Game ID','error'); return; }
  try {
    createRoomBtn.disabled=true;
    if(!connection || connection.state !== signalR.HubConnectionState.Connected){ await initConnection(); }
    await connection.invoke('CreateGameRoom', gameId, false);
  } catch(e){ showStatus('Failed to create room: '+e.message,'error'); }
  finally { createRoomBtn.disabled=false; }
});
openPlayerPageBtn.addEventListener('click', ()=> window.open('player.html','_blank'));
startGameBtn.addEventListener('click', async ()=>{ if(!currentRoomCode) return; try { startGameBtn.disabled=true; await connection.invoke('StartGame', currentRoomCode); } catch(e){ showStatus('Failed to start game: '+e.message,'error'); startGameBtn.disabled=false; }});
backToSetupBtn.addEventListener('click', resetToSetup);
nextQuestionBtn.addEventListener('click', async ()=>{ if(!currentRoomCode) return; try { await connection.invoke('ProceedToNextQuestion', currentRoomCode); nextQuestionBtn.disabled=true; } catch(e){ showStatus('Failed: '+e.message,'error'); }});
endGameBtn.addEventListener('click', ()=>{ if(confirm('End game now?')) showFinalLeaderboard(); });
newGameBtn.addEventListener('click', resetToSetup);

window.addEventListener('load', ()=>{ /* placeholder for init if needed */ });
</script>
</body>
</html>
